<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetta - Streaming Donghua</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 0; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
        
        .top-header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 1000; }
        .logo { font-size: 26px; font-weight: 900; font-style: italic; background: linear-gradient(90deg, #ff3b30, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .header-icons { display: flex; gap: 18px; font-size: 20px; color: #f1f1f1; cursor: pointer; }

        .page-content { display: none; padding-top: 70px; }
        .page-content.active { display: block; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; padding: 20px 0; }
        .schedule-layout { display: flex; gap: 15px; max-width: 640px; margin: 0 auto; padding: 20px 10px; }
        .schedule-main { flex: 1; }
        
        .movie-card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform 0.2s ease; margin-bottom: 15px; }
        .movie-card:hover { transform: scale(1.05); }
        .image-container { position: relative; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); background-color: #1a1a1a; }
        .image-container img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .badge-new { position: absolute; top: 0; left: 0; background-color: #ff3b30; color: white; font-size: 10px; font-weight: bold; padding: 4px 8px; border-bottom-right-radius: 8px; }
        .badge-rating { position: absolute; top: 4px; right: 4px; background-color: rgba(0, 0, 0, 0.6); color: #ffd700; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .badge-episode { position: absolute; bottom: 4px; left: 4px; color: white; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .movie-title { font-size: 12px; font-weight: normal; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .day-sidebar { width: 110px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 80px; height: fit-content; }
        .day-btn { background-color: #1e1e1e; color: #aaa; border: none; padding: 12px 10px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
        .day-btn.active { background-color: #ff3b30; color: white; box-shadow: 0 0 10px rgba(255,59,48,0.4); }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #ff3b30; display: flex; align-items: center; justify-content: space-between; }

        /* Halaman Detail */
        .detail-header-bg { position: relative; width: 100%; height: 280px; background-size: cover; background-position: center; background-color: #222; }
        .detail-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(18,18,18,0.2), #121212); }
        .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; z-index: 10; }
        
        .detail-body { max-width: 640px; margin: -50px auto 0 auto; padding: 0 20px; position: relative; z-index: 5; }
        .schedule-info { color: #ff3b30; font-weight: bold; font-size: 14px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
        .detail-title { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .detail-subtitle { color: #aaa; font-size: 13px; margin-bottom: 15px; }

        .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag-pill { background-color: #1e1e1e; border: 1px solid #333; color: #ddd; font-size: 11px; padding: 6px 12px; border-radius: 20px; }
        .tag-pill.gold { color: #ffd700; border-color: #554400; }

        .action-buttons { display: flex; gap: 12px; margin-bottom: 25px; }
        .btn-watch { flex: 1; background-color: #ff3b30; color: white; border: none; padding: 14px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,59,48,0.4); }
        .btn-sub { flex: 1; background-color: #2b2b2b; color: white; border: none; padding: 14px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; }

        .synopsis-section { margin-bottom: 30px; }
        .synopsis-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .synopsis-text { color: #bbb; font-size: 13px; line-height: 1.6; }

        /* Navigasi Bawah */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2a2a2a; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #777; font-size: 11px; text-decoration: none; gap: 6px; transition: color 0.3s ease; cursor: pointer; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #ff3b30; position: relative; }
        .nav-item.active::before { content: ""; position: absolute; top: -12px; width: 4px; height: 4px; background-color: #ff3b30; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255, 59, 48, 0.4); animation: popIn 0.3s ease forwards; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Modal Video */
        .video-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 100%; max-width: 640px; padding: 20px; }
        .close-btn { position: absolute; top: -20px; right: 20px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; z-index: 10000; }
        .close-btn:hover { color: #ff3b30; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 59, 48, 0.5); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .loading-text { text-align: center; width: 100%; font-size: 14px; color: #777; grid-column: span 3; padding: 40px; }
    </style>
</head>
<body>

    <header class="top-header" id="mainHeader">
        <div class="logo">Zetta</div>
        <div class="header-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
    </header>

    <!-- HOME -->
    <div id="pageHome" class="page-content active">
        <div class="movie-grid" id="movieContainer">
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Memuat database Google Sheets...</div>
        </div>
    </div>

    <!-- SCHEDULE -->
    <div id="pageSchedule" class="page-content">
        <div class="schedule-layout">
            <div class="schedule-main">
                <div class="section-title">
                    <span id="activeDayTitle">Minggu</span> 
                    <span style="font-size: 13px; color: #888;" id="animeCount">(0 Anime)</span>
                </div>
                <div class="movie-grid" id="scheduleContainer" style="padding: 0;"></div>
            </div>
            
            <div class="day-sidebar">
                <button class="day-btn" onclick="pilihHari('Senin', this)">Senin</button>
                <button class="day-btn" onclick="pilihHari('Selasa', this)">Selasa</button>
                <button class="day-btn" onclick="pilihHari('Rabu', this)">Rabu</button>
                <button class="day-btn" onclick="pilihHari('Kamis', this)">Kamis</button>
                <button class="day-btn" onclick="pilihHari('Jumat', this)">Jumat</button>
                <button class="day-btn" onclick="pilihHari('Sabtu', this)">Sabtu</button>
                <button class="day-btn active" onclick="pilihHari('Minggu', this)">Minggu</button>
            </div>
        </div>
    </div>

    <!-- DETAIL ANIME -->
    <div id="pageDetail" class="page-content" style="padding-top: 0;">
        <div class="detail-header-bg" id="detailBg">
            <button class="back-btn" onclick="kembaliKeHome()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="detail-overlay"></div>
        </div>
        <div class="detail-body">
            <div class="schedule-info"><i class="fa-regular fa-calendar"></i> Tayang Rutin</div>
            <div class="detail-title" id="detailTitle">Judul Anime</div>
            <div class="detail-subtitle" id="detailOriginalTitle">Donghua, Mandarin</div>

            <div class="tags-row" id="detailTags">
                <div class="tag-pill gold">★ 8.5</div>
                <div class="tag-pill">Donghua</div>
                <div class="tag-pill">Ongoing</div>
            </div>

            <div class="action-buttons">
                <button class="btn-watch" onclick="putarVideoFull()"><i class="fa-solid fa-play"></i> Putar Video / Eps</button>
                <button class="btn-sub" onclick="alert('Berhasil berlangganan!')">Subscribe</button>
            </div>

            <div class="synopsis-section">
                <div class="synopsis-title">Sinopsis</div>
                <div class="synopsis-text" id="detailOverview">Sinopsis singkat akan muncul di sini...</div>
            </div>
        </div>
    </div>

    <!-- NAVIGASI BAWAH -->
    <nav class="bottom-nav" id="bottomNav">
        <a onclick="gantiHalaman('home', this)" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a onclick="gantiHalaman('schedule', this)" class="nav-item"><i class="fa-regular fa-calendar"></i><span>Schedule</span></a>
        <a class="nav-item"><i class="fa-solid fa-layer-group"></i><span>Catalog</span></a>
        <a class="nav-item"><i class="fa-solid fa-boxes-stacked"></i><span>Library</span></a>
        <a class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- POPUP VIDEO -->
    <div id="videoModal" class="video-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupVideo()">&times;</span>
            <div class="iframe-container">
                <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // ID Google Sheets Anda
        const sheetId = '1dS8YSbNXsvhn10v6LXLMrawzmyczAcqcCyl9GrylHTU';
        const urlAPI = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1`;
        
        let semuaDataDonghua = [];
        let filmAktif = null;

        // Ambil Data dari Google Sheets
        fetch(urlAPI)
            .then(response => response.text())
            .then(data => {
                const jsonData = JSON.parse(data.substring(47, data.length - 2));
                const barisFilm = jsonData.table.rows;
                
                semuaDataDonghua = barisFilm.map((baris, index) => {
                    return {
                        id: index,
                        judul: baris.c[0] ? baris.c[0].v : 'Tanpa Judul',
                        poster: baris.c[1] ? baris.c[1].v : '',
                        rating: baris.c[2] ? baris.c[2].v : '8.0',
                        episode: baris.c[3] ? baris.c[3].v : 'Ongoing',
                        youtubeId: baris.c[4] ? baris.c[4].v : 'vOewtTIOX7w', // Bisa berupa ID YouTube atau Link Full Video
                        label: baris.c[5] ? baris.c[5].v : 'New',
                        sinopsis: "Kisah epik pertarungan kultivasi dunia persilatan Donghua penentang takdir."
                    };
                });

                tampilkanHome(semuaDataDonghua);
                pilihHari('Minggu', document.querySelector('.day-btn.active'));
            })
            .catch(error => {
                document.getElementById('movieContainer').innerHTML = '<div class="loading-text" style="color:red;">Gagal memuat Google Sheets. Pastikan akses link sudah diatur ke "Siapa saja yang memiliki link".</div>';
            });

        function tampilkanHome(daftar) {
            let htmlCard = '';
            daftar.forEach(film => {
                htmlCard += buatKartuFilm(film);
            });
            document.getElementById('movieContainer').innerHTML = htmlCard;
        }

        function pilihHari(namaHari, tombolElemen) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            tombolElemen.classList.add('active');
            document.getElementById('activeDayTitle').innerText = namaHari;

            let indexMod = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'].indexOf(namaHari);
            let hasilFilter = semuaDataDonghua.filter((_, i) => i % 7 === indexMod);
            if(hasilFilter.length === 0) hasilFilter = semuaDataDonghua.slice(0, 4);

            document.getElementById('animeCount').innerText = `(${hasilFilter.length} Anime)`;

            let htmlCard = '';
            hasilFilter.forEach(film => {
                htmlCard += buatKartuFilm(film);
            });
            document.getElementById('scheduleContainer').innerHTML = htmlCard;
        }

        function buatKartuFilm(film) {
            return `
            <div class="movie-card" onclick="bukaDetail(${film.id})">
                <div class="image-container">
                    <img src="${film.poster}" alt="${film.judul}">
                    <div class="badge-new">${film.label}</div>
                    <div class="badge-rating">★ ${film.rating}</div>
                    <div class="badge-episode">${film.episode}</div>
                </div>
                <div class="movie-title">${film.judul}</div>
            </div>
            `;
        }

        function bukaDetail(idFilm) {
            const film = semuaDataDonghua.find(f => f.id === idFilm);
            if(!film) return;

            filmAktif = film;

            document.getElementById('detailBg').style.backgroundImage = `url('${film.poster}')`;
            document.getElementById('detailTitle').innerText = film.judul;
            document.getElementById('detailOriginalTitle').innerText = `${film.judul}, Donghua, Mandarin`;
            document.getElementById('detailOverview').innerText = film.sinopsis;
            
            document.getElementById('detailTags').innerHTML = `
                <div class="tag-pill gold">★ ${film.rating}</div>
                <div class="tag-pill">Donghua</div>
                <div class="tag-pill">${film.episode}</div>
            `;

            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
            
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('pageDetail').classList.add('active');
            window.scrollTo(0, 0);
        }

        function kembaliKeHome() {
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('bottomNav').style.display = 'flex';
            
            document.getElementById('pageDetail').classList.remove('active');
            document.getElementById('pageHome').classList.add('active');
        }

        function gantiHalaman(namaHalaman, elemenNav) {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            elemenNav.classList.add('active');
            document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));

            if (namaHalaman === 'home') {
                document.getElementById('pageHome').classList.add('active');
            } else if (namaHalaman === 'schedule') {
                document.getElementById('pageSchedule').classList.add('active');
            }
        }

        // FUNGSI MEMUTAR VIDEO FULL / EPISODE DARI GOOGLE SHEETS
        function putarVideoFull() {
            if(!filmAktif) return;
            
            const modalVideo = document.getElementById('videoModal');
            const youtubePlayer = document.getElementById('youtubePlayer');
            
            modalVideo.style.display = 'flex'; 

            // Mengecek apakah link dari Google Sheets berupa URL lengkap atau ID YouTube saja
            let linkVideo = filmAktif.youtubeId;
            if (linkVideo.startsWith('http')) {
                youtubePlayer.src = linkVideo + (linkVideo.includes('?') ? '&autoplay=1' : '?autoplay=1');
            } else {
                youtubePlayer.src = `https://www.youtube.com/embed/${linkVideo}?autoplay=1`;
            }
        }

        function tutupVideo() {
            document.getElementById('videoModal').style.display = 'none'; 
            youtubePlayer.src = ""; 
        }
    </script>
</body>
</html>
