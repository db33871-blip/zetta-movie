<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetta - Streaming Donghua</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; padding-top: 80px; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        .top-header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 1000; }
        .logo { font-size: 26px; font-weight: 900; font-style: italic; background: linear-gradient(90deg, #ff3b30, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .header-icons { display: flex; gap: 18px; font-size: 20px; color: #f1f1f1; cursor: pointer; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; }
        
        .movie-card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform 0.2s ease; }
        .movie-card:hover { transform: scale(1.05); }
        .image-container { position: relative; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .image-container img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .badge-new { position: absolute; top: 0; left: 0; background-color: #ff3b30; color: white; font-size: 10px; font-weight: bold; padding: 4px 8px; border-bottom-right-radius: 8px; }
        .badge-rating { position: absolute; top: 4px; right: 4px; background-color: rgba(0, 0, 0, 0.6); color: #ffd700; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .badge-episode { position: absolute; bottom: 4px; left: 4px; color: white; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .movie-title { font-size: 12px; font-weight: normal; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2a2a2a; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #777; font-size: 11px; text-decoration: none; gap: 6px; transition: color 0.3s ease; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #ff3b30; position: relative; }
        .nav-item.active::before { content: ""; position: absolute; top: -12px; width: 4px; height: 4px; background-color: #ff3b30; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255, 59, 48, 0.4); animation: popIn 0.3s ease forwards; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .video-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 100%; max-width: 640px; padding: 20px; }
        .close-btn { position: absolute; top: -20px; right: 20px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; z-index: 10000; }
        .close-btn:hover { color: #ff3b30; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 0 20px rgba(255, 59, 48, 0.5); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .loading-text { text-align: center; width: 100%; font-size: 14px; color: #777; grid-column: span 3; }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="logo">Zetta</div>
        <div class="header-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
    </header>

    <div class="movie-grid" id="movieContainer">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Menyedot data Donghua...</div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i><span>Schedule</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-layer-group"></i><span>Catalog</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i><span>Library</span></a>
        <a href="#" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- Popup Video -->
    <div id="videoModal" class="video-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="tutupVideo()">&times;</span>
            <div class="iframe-container">
                <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // =======================================================
        // MASUKKAN API KEY ANDA DI SINI
        // =======================================================
        const API_KEY = '88d8d356683377306d8706b1f09ee891'; 
        
        // Link untuk mencari SERIAL TV (Donghua biasanya serial), Bahasa Mandarin (zh), Genre Animasi (16)
        const urlAPI = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_original_language=zh&with_genres=16&sort_by=popularity.desc&page=1`;
        const urlGambar = 'https://image.tmdb.org/t/p/w500';

        // 1. FUNGSI MENYEDOT DATA DONGHUA
        fetch(urlAPI)
            .then(response => response.json()) 
            .then(data => {
                const daftarFilm = data.results; 
                let htmlCard = '';

                // Memproses 15 donghua pertama
                daftarFilm.slice(0, 15).forEach(film => {
                    const judul = film.name; // Di TMDB, Serial TV menggunakan 'name', bukan 'title'
                    const poster = urlGambar + film.poster_path; 
                    const rating = film.vote_average.toFixed(1); 
                    const rilis = film.first_air_date ? film.first_air_date.substring(0, 4) : 'N/A'; // Tahun rilis

                    htmlCard += `
                    <div class="movie-card" onclick="cariDanBukaVideo(${film.id})">
                        <div class="image-container">
                            <img src="${poster}" alt="${judul}">
                            <div class="badge-new">Donghua</div>
                            <div class="badge-rating">★ ${rating}</div>
                            <div class="badge-episode">${rilis}</div>
                        </div>
                        <div class="movie-title">${judul}</div>
                    </div>
                    `;
                });

                document.getElementById('movieContainer').innerHTML = htmlCard;
            })
            .catch(error => {
                document.getElementById('movieContainer').innerHTML = '<div class="loading-text" style="color:red;">Gagal menarik data. Pastikan API Key Anda sudah benar.</div>';
            });


        // 2. FUNGSI MENCARI TRAILER YOUTUBE
        function cariDanBukaVideo(idFilm) {
            // Karena ini Serial TV, kita gunakan link /tv/
            const urlVideo = `https://api.themoviedb.org/3/tv/${idFilm}/videos?api_key=${API_KEY}`;
            
            fetch(urlVideo)
                .then(res => res.json())
                .then(data => {
                    const videos = data.results;
                    // Mencari video dari YouTube
                    const trailer = videos.find(vid => vid.site === 'YouTube');
                    
                    if (trailer) {
                        const modalVideo = document.getElementById('videoModal');
                        const youtubePlayer = document.getElementById('youtubePlayer');
                        
                        modalVideo.style.display = 'flex'; 
                        youtubePlayer.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
                    } else {
                        alert("Maaf, cuplikan video untuk Donghua ini belum tersedia di database TMDB.");
                    }
                });
        }

        // 3. FUNGSI MENUTUP VIDEO
        function tutupVideo() {
            document.getElementById('videoModal').style.display = 'none'; 
            document.getElementById('youtubePlayer').src = ""; 
        }

        // 4. LOGIKA MENU BAWAH
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', function(event) {
                event.preventDefault(); 
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
